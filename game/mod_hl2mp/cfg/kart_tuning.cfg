// Kart movement tuning. The server execs this when the game rules are created
// (every map start), so edits here take effect on the next map without a rebuild.
// All of these are replicated to clients: prediction uses the same values.

// top speed with W held, units per second
kart_max_speed 650
// acceleration toward the target speed, units per second squared
kart_accel 300
// steering rate with A or D held, degrees per second
kart_turn_rate 90
// below this speed the kart cannot turn
kart_turn_min_speed 20
