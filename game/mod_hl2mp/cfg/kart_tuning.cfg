// HL2 Kart tuning. `exec kart_tuning` in the console to apply changes without a restart.
// server.cfg (dedicated) and listenserver.cfg exec this on every map start, so edits
// here take effect on the next map without a rebuild. To override a value on one server,
// set it in that cfg after its `exec kart_tuning.cfg` line.

// --- Movement (server, replicated to clients: prediction uses the same values) ---

// Mode and model (take effect on respawn). Uncomment to change.
// kart_enabled 1
// kart_model <model path>

// Speed. Units per second, accelerations in units per second squared.
// top speed with W held
kart_max_speed 650
// acceleration toward top speed once past kart_accel_low_threshold
kart_accel 300
// acceleration from a standstill up to kart_accel_low_threshold (a punchier launch)
kart_accel_low 500
kart_accel_low_threshold 300
// deceleration with S held while rolling forward (or W while rolling backward)
kart_brake_decel 500
// reverse: top speed, acceleration, and the seconds S has to be held at a standstill first
kart_reverse_speed 150
kart_reverse_accel 250
kart_reverse_delay 0.25
// deceleration with no throttle
kart_coast_decel 120

// Steering, degrees per second with A or D held. The rate goes from kart_turn_rate_low
// at a standstill to kart_turn_rate_high at kart_max_speed: tight turns slow, wide turns fast.
kart_turn_rate_low 120
kart_turn_rate_high 70
// below this speed the kart cannot turn
kart_turn_min_speed 20

// Air. Steering rate multiplier while airborne, and how fast the airborne velocity
// turns toward the heading (fraction per second, 0 = keeps its momentum).
kart_air_turn_scale 0.5
kart_air_control 2

// Wall bumps. A collision that takes more than kart_bump_threshold off the speed is a bump:
// the kart keeps kart_bump_restitution of what is left and thuds, at most once per
// kart_bump_cooldown seconds. Smaller losses (glancing a wall) just bleed speed.
kart_bump_threshold 100
kart_bump_restitution 0.5
kart_bump_cooldown 0.3

// Hop and drift. Tap jump on the ground to hop (upward speed, units per second).
kart_hop_velocity 160
// Hold jump and steer at kart_drift_min_speed or faster (on the ground, or as a hop
// lands) to drift that way until jump is released, the speed drops below it, or a wall bump.
kart_drift_min_speed 250
// While drifting the nose points this many degrees into the turn past the direction of
// travel; the slip angle builds up and straightens out at kart_drift_slip_rate degrees per second.
kart_drift_slip_angle 25
kart_drift_slip_rate 90
// Drift turn rate in degrees per second: kart_drift_turn_max steering into the drift,
// kart_drift_turn_min steering against it, halfway between with no steer. Keep them near
// kart_turn_rate_high (normal steering at speed), or steering into a drift snaps the kart round.
kart_drift_turn_min 45
kart_drift_turn_max 105

// Mini-turbo. A drift charges while it lasts, kart_turbo_charge_min per second steering
// against the drift up to kart_turbo_charge_max steering into it (halfway between with no
// steer). Releasing jump at a charge of kart_turbo_tierN_time or more gives a boost of
// kart_turbo_tierN_duration seconds. A drift that ends on a wall bump, or below
// kart_drift_min_speed, gives nothing.
kart_turbo_charge_min 0.75
kart_turbo_charge_max 1.25
kart_turbo_tier1_time 0.6
kart_turbo_tier2_time 1.4
kart_turbo_tier3_time 2.4
kart_turbo_tier1_duration 0.6
kart_turbo_tier2_duration 1.0
kart_turbo_tier3_duration 1.6
// Boost: the speed is at least kart_max_speed times kart_boost_scale while it lasts,
// then slows back down to kart_max_speed at kart_boost_decay units per second squared.
kart_boost_scale 1.3
kart_boost_decay 400
// Boost effects (client, archived in config.cfg): set them in your own console or autoexec.
// degrees the field of view widens while boosting
// kart_boost_fov_kick 12
// units the chase camera pulls back while boosting
// kart_boost_cam_pullback 30
// seconds the FOV kick and pull-back take to ease in and out
// kart_boost_cam_blend 0.2
// draw the boost exhaust flame and mini-turbo drift sparks (0 = off)
// kart_boost_fx 1

// Hit reactions (items hitting a kart). A spin-out keeps kart_spinout_speed_scale of the
// speed, then skids to a stop at kart_spinout_decel over kart_spinout_time seconds with no
// inputs, the body spinning kart_spinout_turns times. A stun lasts kart_stun_time: the
// kart still drives and steers, but can't hop or drift and its speed is cut to (and held
// under) kart_stun_speed_scale. Either cancels a drift and a boost. A kart can't be hit
// again until kart_hit_immunity seconds after the last hit ended.
kart_spinout_time 1.0
kart_spinout_turns 2
kart_spinout_speed_scale 0.5
kart_spinout_decel 500
kart_stun_time 0.5
kart_stun_speed_scale 0.5
kart_hit_immunity 1.0

// --- Engine sound (client, archived in config.cfg) ---
// The engine idle loop is pitched from kart_engine_pitch_min at a standstill to
// kart_engine_pitch_max at kart_max_speed (percent, 100 = recorded pitch).
// These are client convars: set them in your own console or autoexec, not on a server.
// kart_engine_pitch_min 85
// kart_engine_pitch_max 170

// --- Chase camera (client, archived in config.cfg) ---
// Client convars like the engine sound ones above: set them in your own console or autoexec.
// distance behind the kart and height above the look-at point
// kart_cam_dist 220
// kart_cam_height 70
// look-at point above the kart origin
// kart_cam_target_height 30
// how fast the camera swings in behind the kart in turns (higher is stiffer)
// kart_cam_follow 6
// field of view
// kart_cam_fov 95
// hide the kart when a wall pulls the camera closer than this to it
// kart_cam_min_dist 80
// Rear view while held (also in Options > Keyboard as "Look back (kart)"):
// bind c +lookback
