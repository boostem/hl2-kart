// Dedicated server defaults (game/run_server.sh). The engine runs this on every map start.
exec kart_tuning.cfg

// --- Server ---
hostname "HL2 Kart"
sv_password ""
// rcon_password ""          // set one to administer the server remotely (kart_bot_add/kart_bot_kick need it)
// 0: clients may use their own content (the mod ships loose files, not a pure whitelist). 1/2 enforce files.
sv_pure 0
sv_cheats 0
sv_lan 0
sv_region 255
sv_allowupload 0
sv_allowdownload 1
motdfile "motd.txt"

// Rates for a 66-tick server.
sv_minrate 20000
sv_maxrate 0
sv_minupdaterate 33
sv_maxupdaterate 66
sv_mincmdrate 33
sv_maxcmdrate 66

// --- Races ---
// Laps per race; 0 uses the map's kart_race_manager value.
kart_laps 3
// Races on a map before the next map of cfg/mapcycle.txt.
kart_races_per_map 2
// Karts needed before a race starts, and seconds to wait for late loaders.
kart_min_players 1
kart_waiting_time 5
kart_countdown_time 3
kart_finish_timeout 30
kart_results_time 10
kart_items_enabled 1

// Bots fill the grid. Lower it (or kart_bot_kick) when enough people play.
kart_bot_quota 4

// --- Map rotation ---
mapcyclefile "mapcycle.txt"
mp_timelimit 0
mp_fraglimit 0

// --- Logging ---
log on
sv_logbans 1
sv_logecho 1
sv_logfile 1
